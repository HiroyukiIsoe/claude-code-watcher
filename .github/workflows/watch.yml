name: Watch Claude Code

on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * 0-4" # JST 08:17, Mon-Fri

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/watch_claude_code.py
